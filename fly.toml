# fly.toml app configuration file generated for gopherdebt-api on 2026-03-01T19:56:55+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gopherdebt-api'
primary_region = 'ams'

[build]

[env]
  GIN_MODE = 'release'
  PORT = '8080'
  AI_DAILY_WISH_LOOKUPS = '0' # wish AI off (shop data only); remove to turn it back on

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
